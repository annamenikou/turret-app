<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151a21">
  <title>Turret Training - Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ---- design tokens ---- */
    :root{
      --bg:#f5f6f8;          /* page background */
      --surface:#ffffff;     /* card / panel background */
      --navy:#14263d;         /* primary text */
      --muted:#5b6672;       /* secondary text */
      --line:#e4e7ec;        /* borders and dividers */
      --accent:#151a21;      /* per-page accent colour (set inline) */
      --radius:14px;         /* shared corner rounding */
    }

    /* ---- base ---- */
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html{ -webkit-text-size-adjust:100%; }               /* stop iOS auto-zoom on text */
    body{
      margin:0;
      font-family:'Jura', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background:var(--bg);
      color:var(--navy);
      font-size:17px;                                    /* bigger base for phone use */
      line-height:1.55;
    }
    a{ color:inherit; text-decoration:none; }            /* links inherit colour, no underline */
    .wrap{
      max-width:640px; margin:0 auto; padding:0 16px 48px;  /* centre + phone padding */
      position:relative;                                    /* lets the watermark sit behind */
    }
    .watermark{                                             /* big faint background logo */
      position:absolute; top:0; left:50%; transform:translateX(-50%);
      width:85%; max-width:480px; opacity:.06;
      pointer-events:none; z-index:-1;
    }

    /* ---- landing top bar ---- */
    .topbar{
      background:var(--navy); color:#fff;
      padding:11px 0;
    }
    .topbar-inner{
      max-width:640px; margin:0 auto; padding:0 16px;
      display:flex; align-items:center; justify-content:space-between;
      gap:10px; text-align:center;
    }
    .topbar .brand-logo{ height:34px; width:auto; flex:none; }
    .topbar .brand{ flex:1; font-weight:700; letter-spacing:3px; font-size:15px; }
    .topbar .brand em{ font-style:normal; opacity:.55; }

    /* ---- landing hero ---- */
    .hero{ padding:22px 0 4px; text-align:center; }
    .hero h1{ margin:0; font-size:29px; font-weight:700; letter-spacing:1px; }
    .hero p{ margin:8px 0 0; color:var(--muted); font-size:16px; }

    /* ---- home hub boxes ---- */
    .hub{ display:flex; flex-direction:column; gap:14px; margin-top:28px; }
    .hub-box{
      display:flex; align-items:center; gap:16px;
      background:var(--surface); border:1px solid var(--line);
      border-left:6px solid var(--accent);               /* colour tab down the side */
      border-radius:var(--radius); padding:20px;
    }
    .hub-icon{
      flex:none; width:52px; height:52px;
      display:flex; align-items:center; justify-content:center;
    }
    .hub-icon img{ width:100%; height:100%; object-fit:contain; }
    .hub-title{ flex:1; font-size:20px; font-weight:700; }
    .chev{ color:var(--muted); font-size:26px; font-weight:700; }

    /* ---- letter-page coloured header ---- */
    .phead{ background:var(--accent); color:#fff; padding:18px 16px 22px; }
    .phead .back{
      display:inline-block; font-size:14px; font-weight:600;
      opacity:.9; margin-bottom:14px; letter-spacing:.5px;
    }
    .phead-main{ display:flex; align-items:center; gap:14px; }
    .phead-badge{
      flex:none; width:60px; height:60px; border-radius:14px;
      background:rgba(255,255,255,.18);
      display:flex; align-items:center; justify-content:center;
      font-size:34px; font-weight:700;
    }
    .phead h1{ margin:0; font-size:26px; font-weight:700; letter-spacing:1px; }
    .phead .lead{ margin:5px 0 0; font-size:15px; opacity:.92; }

    /* ---- content blocks (letter pages) ---- */
    .block{
      background:var(--surface); border:1px solid var(--line);
      border-radius:var(--radius); padding:14px 18px; margin:12px 0;
    }
    .block h2{
      margin:0 0 8px; font-size:19px;
      padding-bottom:8px; border-bottom:2px solid var(--accent);
      display:inline-block;                              /* underline hugs the text */
    }
    .block .note{ color:var(--muted); margin:0; font-size:16px; }
    .block ul{ margin:8px 0 0; padding-left:20px; }
    .block li{ margin:7px 0; font-size:17px; }

    /* ---- full-guide button ---- */
    .fullbtn{
      display:block; text-align:center;
      background:var(--accent); color:#fff;
      font-weight:700; letter-spacing:.5px;
      padding:15px; border-radius:12px; margin:16px 0;
    }
    .fullbtn.ghost{ background:var(--surface); color:var(--accent); border:2px solid var(--accent); }

    /* ---- accessibility: keyboard focus + reduced motion ---- */
    a:focus-visible{ outline:3px solid #111; outline-offset:2px; }
    @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
  </style>
</head>
<body>

  <!-- Brand bar -->
  <div class="topbar">
    <div class="topbar-inner">
      <a href="index.html" aria-label="Home"><img src="/Images/turret_home.png" alt="" class="brand-logo"></a>
      <span class="brand">TURRET <em>&middot; HOME</em></span>
      <a href="https://www.turretmedtraining.com/contact" target="_blank" rel="noopener" aria-label="Contact"><img src="/Images/phone.png" alt="" class="brand-logo"></a>
    </div>
  </div>

  <div class="wrap">

    <img src="/Images/turret.png" alt="" class="watermark">

    <!-- Title -->
    <div class="hero">
      <h1>TURRET MEDICAL TRAINING</h1>
      <p>SIMPLE THINGS, DONE WELL, SAVE LIVES</p>
    </div>

    <!-- Hub: the three main sections -->
    <nav class="hub">
      <a class="hub-box" style="--accent:#d92d20" href="/Pages/emergency.html">
        <span class="hub-icon"><img src="/Images/emergency.jpg" alt=""></span>
        <span class="hub-title">Emergency Guides</span>
        <span class="chev">&rsaquo;</span>
      </a>
      <a class="hub-box" style="--accent:#175cd3" href="/Pages/d13resources.html">
        <span class="hub-icon"><img src="/Images/book.png" alt=""></span>
        <span class="hub-title">D13 Resources</span>
        <span class="chev">&rsaquo;</span>
      </a>
      <a class="hub-box" style="--accent:#067647" href="/Pages/aboutus.html">
        <span class="hub-icon"><img src="/Images/aboutus.png" alt=""></span>
        <span class="hub-title">About Us</span>
        <span class="chev">&rsaquo;</span>
      </a>
    </nav>

  </div>
</body>
</html>
