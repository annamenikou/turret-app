<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151a21">
  <title>D13 Resources · Turret Training</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ---- design tokens ---- */
    :root{
      --bg:#f5f6f8;          /* page background */
      --surface:#ffffff;     /* card / panel background */
      --navy:#14263d;         /* primary text */
      --muted:#5b6672;       /* secondary text */
      --line:#e4e7ec;        /* borders and dividers */
      --accent:#175cd3;      /* per-page accent colour */
      --radius:14px;         /* shared corner rounding */
    }

    /* ---- base ---- */
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html{ -webkit-text-size-adjust:100%; }               /* stop iOS auto-zoom on text */
    body{
      margin:0;
      font-family:'Jura', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background:var(--bg);
      color:var(--navy);
      font-size:17px;                                    /* bigger base for phone use */
      line-height:1.55;
    }
    a{ color:inherit; text-decoration:none; }            /* links inherit colour, no underline */
    .wrap{
      max-width:640px; margin:0 auto; padding:0 16px 48px;  /* centre + phone padding */
      position:relative;                                    /* lets the watermark sit behind */
    }
    .watermark{                                             /* big faint background logo */
      position:absolute; top:0; left:50%; transform:translateX(-50%);
      width:85%; max-width:480px; opacity:.06;
      pointer-events:none; z-index:-1;
    }

    /* ---- landing top bar ---- */
    .topbar{
      background:var(--navy); color:#fff;
      padding:11px 0;
    }
    .topbar-inner{
      max-width:640px; margin:0 auto; padding:0 16px;
      display:flex; align-items:center; justify-content:space-between;
      gap:10px; text-align:center;
    }
    .topbar .brand-logo{ height:34px; width:auto; flex:none; }
    .topbar .brand{ flex:1; font-weight:700; letter-spacing:3px; font-size:15px; }
    .topbar .brand em{ font-style:normal; opacity:.55; }

    /* ---- landing hero ---- */
    .hero{ padding:22px 0 4px; text-align:center; }
    .hero h1{ margin:0; font-size:29px; font-weight:700; letter-spacing:1px; }
    .hero p{ margin:8px 0 0; color:var(--muted); font-size:16px; }

    /* ---- hero image ---- */
    .hero-img{
      background:var(--surface); border:1px solid var(--line);
      border-radius:var(--radius); margin:16px 0;
      display:flex; justify-content:center; align-items:center;
      padding:24px; overflow:hidden;
    }
    .hero-img img{ max-width:100%; max-height:320px; object-fit:contain; }

    /* ---- content blocks ---- */
    .block{
      background:var(--surface); border:1px solid var(--line);
      border-radius:var(--radius); padding:14px 18px; margin:12px 0;
    }
    .block h2{
      margin:0 0 8px; font-size:19px;
      padding-bottom:8px; border-bottom:2px solid var(--accent);
      display:inline-block;                              /* underline hugs the text */
    }
    .block p{ font-size:16px; line-height:1.5; }
    .block .note{ color:var(--muted); margin:0; font-size:16px; }
    .block ul{ margin:8px 0 0; padding-left:20px; }
    .block li{ margin:7px 0; font-size:17px; }

    /* ---- accessibility: keyboard focus + reduced motion ---- */
    a:focus-visible{ outline:3px solid #111; outline-offset:2px; }
    @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
  </style>
</head>
<body>

  <!-- Brand bar -->
  <div class="topbar">
    <div class="topbar-inner">
      <a href="/index.html" aria-label="Home"><img src="/Images/turret_home.png" alt="" class="brand-logo"></a>
      <span class="brand">TURRET <em>&middot; D13 RESOURCES</em></span>
      <a href="https://www.turretmedtraining.com/contact" target="_blank" rel="noopener" aria-label="Contact"><img src="/Images/phone.png" alt="" class="brand-logo"></a>
    </div>
  </div>

  <div class="wrap">

    <img src="/Images/turret.png" alt="" class="watermark">

    <!-- Title -->
    <div class="hero">
      <h1>D13 COURSE RESOURCES</h1>
      <p>Materials and reference guides for the D13 course</p>
    </div>

 

  </div>
</body>
</html>
