<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jura:wght@300..700&display=swap" rel="stylesheet">
<title>D13 Resources</title>
<style>
:root {
--navy: #14263d;
--line: #d9d9d9;
--page-bg: #e8e8e8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
font-family: "Jura", sans-serif;
background: var(--page-bg);
color: var(--navy);
display: flex;
justify-content: center;
padding: 16px;
}

.app {
width: 100%;
max-width: 480px;
background: #fff;
border: 1px solid var(--line);
display: flex;
flex-direction: column;
}

/* Top nav */
nav.topbar {
display: flex;
border: 1px solid var(--line);
margin: 16px;
}
nav.topbar a {
flex: 1;
text-align: center;
padding: 18px 8px;
font-size: 18px;
letter-spacing: 1px;
text-decoration: none;
color: var(--navy);
border-right: 1px solid var(--line);
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
}
nav.topbar a:last-child { border-right: none; }

/* Title */
.title {
text-align: center;
font-weight: 500;
font-size: 40px;
letter-spacing: 2px;
margin: 8px 0 20px;
}

/* Hero image */
.hero {
margin: 0 16px;
display: flex;
justify-content: center;
align-items: center;
max-height: 480px;
overflow: hidden;
}
.hero img {
max-width: 100%;
max-height: 480px;
object-fit: contain;
}

/* Bottom tiles */
.tiles {
display: flex;
border: 1px solid var(--line);
margin: 20px 16px 24px;
}
.tile {
flex: 1;
text-align: center;
padding: 18px 8px 20px;
border-right: 1px solid var(--line);
text-decoration: none;
background: #fff;
color: var(--navy);
}
.tile:last-child { border-right: none; }
.tile.active {
background: var(--navy);
color: #fff;
}
.tile .icon {
width: 64px;
height: 44px;
margin: 0 auto 14px;
object-fit: contain;
}
.tile .label {
font-size: 19px;
line-height: 1.15;
letter-spacing: 1px;
}
</style>
</head>
<body>
<div class="app">

<!-- TOP NAV -->
<nav class="topbar">
<a href="index.html">HOME</a>
<a href="website.html">WEBSITE</a>
<a href="contact.html"><img src="phone.png" alt="" style="width:22px;height:22px;"> CONTACT</a>
</nav>

<!-- TITLE -->
<h1 class="title">D13 RESOURCES</h1>

<!-- HERO IMAGE -->
<div class="hero"><img src="turret.png" alt="Turret Training logo"></div>

<!-- BOTTOM TILES -->
<nav class="tiles">
<a href="/Pages/emergency.html" class="tile">
<img src="/Images/emergency.jpg" alt="" class="icon">
<div class="label">EMERGENCY<br>GUIDES</div>
</a>
<a href="/Pages/d13resources.html" class="tile active">
<img src="/Images/book.png" alt="" class="icon">
<div class="label">D13 COURSE<br>RESOURCES</div>
</a>
<a href="/Pages/aboutus.html" class="tile">
<img src="/Images/aboutus.png" alt="" class="icon">
<div class="label">ABOUT<br>US</div>
</a>
</nav>

</div>
</body>
</html>
