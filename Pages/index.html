<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jura:wght@300..700&display=swap" rel="stylesheet">
<title>Turret Training</title>
<style>
  :root {
    --navy: #14263d;
    --line: #d9d9d9;
    --page-bg: #e8e8e8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Jura", sans-serif;
    background: var(--page-bg);
    color: var(--navy);
    display: flex; 
    justify-content: center;
    padding: 16px; 
  }

  .app {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
  }

  /* Top nav */
  nav {
    display: flex;
    border: 1px solid var(--line);
    margin: 16px;
  }
  nav a {
    flex: 1;
    text-align: center;
    padding: 18px 8px;
    font-size: 18px;
    letter-spacing: 1px;
    text-decoration: none;
    color: var(--navy);
    border-right: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  nav a:last-child { border-right: none; }

  .phone-mark {
    display: inline-block;
    border: 1px solid var(--navy);
    border-radius: 3px;
    font-size: 10px;
    padding: 2px 4px;
    letter-spacing: 0;
  }

  /* Title */
  .title {
    text-align: center;
    font-weight: 800;
    font-size: 40px;
    letter-spacing: 2px;
    margin-top: 8px;
  }
  .subtitle {
    text-align: center;
    font-size: 20px;
    letter-spacing: 1px;
    margin: 10px 0 8px;
  }

  /* Placeholder box shared style */
  .img-box {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f2f2f2;
    border: 1px dashed #b9b9b9;
    color: #8a8a8a;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Hero image placeholder */
  .hero {
    margin: 0 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    max-height: 300px;     /* the height cap — lower this to shrink further */
    overflow: hidden;
}
.hero img {
    max-width: 100%;
    max-height: 300px;     /* keep this the same as .hero's max-height */
    object-fit: contain;
}

  /* Bottom tiles */
  .tiles {
    display: flex;
    border-top: 1px solid var(--line);
    margin: 20px 16px 24px;
    border: 1px solid var(--line);
  }
  .tile {
    flex: 1;
    text-align: center;
    padding: 18px 8px 20px;
    border-right: 1px solid var(--line);
    cursor: pointer;
    background: #fff;
    color: var(--navy);
    text-decoration: none;
  }
  .tile:last-child { border-right: none; }
  .tile.active {
    background: var(--navy);
    color: #fff;
  }
  .tile .icon {
    width: 64px;
    height: 44px;
    margin: 0 auto 14px;
    font-size: 11px;
  }
  .tile .label {
    font-size: 19px;
    line-height: 1.15;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="app">

    <nav>
      <a href="/Pages/index.html">HOME</a>
      <a href="https://www.turretmedtraining.com "target="_blank" >WEBSITE</a>
      <a href="https://www.turretmedtraining.com/contact" target="_blank"><img src="/Images/phone.png" alt="" style="width:22px;height:22px;"> CONTACT</a>
      
    </nav>

    <h1 class="title">TURRET TRAINING</h1>
    <p class="subtitle">SIMPLE THINGS DONE WELL, SAVE LIVES</p>

    <div class="hero"><img src="/Images/turret.png" alt="Turret Training logo"></div>

    <div class="tiles">
      <a href="/Pages/emergency.html" class="tile active">
        <img src="/Images/emergency.jpg" alt="" class="icon">
        <div class="label">EMERGENCY<br>GUIDES</div>
      </a>
      <a href="/Pages/d13resources.html" class="tile active">
        <img src="/Images/book.png" alt="" class="icon">
        <div class="label">D13 COURSE<br>RESOURCES</div>
      </a>
      <a href="/Pages/aboutus.html" class="tile active">
        <img src="/Images/aboutus.png" alt="" class="icon">
        <div class="label">ABOUT<br>US</div>
      </a>
    </div>

  </div>

  

</body>
</html>
